name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter web exec tsc --noEmit
      # The committed registry JSON and API docs must match the components.
      - run: pnpm registry:build && git diff --exit-code -- apps/web/public/r apps/web/src/lib/component-api.json
      - run: pnpm --filter web exec playwright install --with-deps chromium
      # Builds the app, checks every page/component with every font, and
      # audits the contrast of every palette.
      - run: pnpm test:layout
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
